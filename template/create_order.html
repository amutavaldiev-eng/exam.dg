{%load static%}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Order</title>
    <link rel="stylesheet" href="{%static 'style.css'%}">
</head>
<body>
    <div class="yy">
        <div class="ohd">
            <h1>Create Order</h1>
            <form method="POST">
                {%csrf_token%}
                <input type="text" name="username" placeholder="Username" required>
                <input type="text" name="phone" placeholder="Phone Number" required>
                <select name="books" required>
                    <option value="">Select Book</option>
                    {%for book in books%}
                    <option value="{{book.id}}">{{book.name}}</option>
                    {%endfor%}
                </select>
                <label>Lend Date:</label>
                <input type="datetime-local" name="lend_at" required>
                <label>Bring Date:</label>
                <input type="datetime-local" name="bring_at" required>
                <button class="obtn" type="submit">Create Order</button>
            </form>
            <a class="oba" href="http://127.0.0.1:8000/">Back Home</a>
        </div>
    </div>
</body>
</html>
